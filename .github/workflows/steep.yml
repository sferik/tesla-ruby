name: type checker
# A tag is checked by push_gem.yml, which calls this workflow before it pushes the gem
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ruby/setup-ruby@b1da4809b005e0178fe08a1d57317bffc00b7b4c # v1.332.0
      with:
        ruby-version: "3.4"
        bundler-cache: true
    - run: bundle exec rake rbs
    - run: bundle exec rake steep
